name: Release

# MANUAL ONLY. This workflow publishes to npm; it must never fire from a push.
# Re-enable automatic releases by restoring the `push: branches: [main]` trigger
# once NPM_TOKEN is set (granular token with "Bypass 2FA") and you are ready to
# ship on every merge.
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # 1. Verification Gate
  verify:
    name: Verify Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Gated Verifications
        run: pnpm verify # build, lint, knip, test, format check (no benchmarks — too noisy on shared runners)

      # The outside-in gate, and the last thing standing between a mistake and
      # a published package. It packs the real tarballs, installs them with npm
      # into a throwaway project outside the repo, and builds against stock Vite
      # 6, 7 and 8 — deliberately using none of this repo's own tooling.
      #
      # This is what catches the failures every internal test passes over:
      # pnpm-only `catalog:` specifiers leaking into the tarball, a peer range
      # that excludes the current Vite, a `files` field that omits something the
      # package needs at runtime.
      - name: Smoke Test the Publishable Artifacts
        run: pnpm smoke

  # 2. Release Job — gated on manual dispatch from main.
  release:
    name: Release to npm
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build
        run: pnpm build

      - name: Publish or Create Version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
