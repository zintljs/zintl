name: Setup Workspace
description: Install Vite+ and the workspace dependencies. The one place CI setup is defined.

# `setup-vp` replaces three steps (pnpm/action-setup + actions/setup-node +
# pnpm install) and resolves the Vite+ version from the `catalog:` entry in
# pnpm-workspace.yaml, so the toolchain version is not duplicated in CI.
# Watch the log for "falling back to latest" — that means the catalog lookup
# failed and CI is no longer running the version this repo pins.

# Deliberately no `registry-url`: publishing authenticates with the workflow's
# OIDC identity, so there is no token to wire into an .npmrc.

runs:
  using: composite
  steps:
    - name: Install Vite+ and Dependencies
      uses: voidzero-dev/setup-vp@v1
      with:
        node-version: "24"
        # Caches the pnpm store, keyed vite-plus-{OS}-{arch}-{pm}-{lockfile-hash}.
        cache: true
        run-install: |
          - args: ['--frozen-lockfile']
